version: '3.8'

services:
  sftpgo:
    image: drakkan/sftpgo:v2.7.1
    ports:
      - "8080:8080"
      - "2022:2022"
    volumes:
      - sftpgo_data:/srv/sftpgo/data
      - ./sftpgo.json:/etc/sftpgo/sftpgo.json:ro
    networks:
      - monitoring-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  monitor:
    # В Swarm мы берем образ, который только что собрали в CI!
    image: zolikmcmillan/monitoring-backend:latest 
    networks:
      - monitoring-net
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - monitoring-net
    deploy:
      replicas: 1

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: monitoring_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - monitoring-net
    deploy:
      replicas: 1

  redis:
    image: redis:7-alpine
    networks:
      - monitoring-net
    deploy:
      replicas: 1

networks:
  monitoring-net:
    driver: overlay

volumes:
  sftpgo_data:
  pg_data:
