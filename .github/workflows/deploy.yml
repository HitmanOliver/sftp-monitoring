name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/monitoring-backend:latest
deploy:
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Docker Swarm
        run: |
          echo "Инициализация Docker Swarm..."
          docker swarm init
          
          echo "Развертывание стека..."
          docker stack deploy -c docker-compose.swarm.yml monitoring
          
          echo "Ожидание запуска сервисов..."
          sleep 15
          
          echo "Проверка статуса сервисов:"
          docker stack services monitoring
          
          echo "Сбор логов Nginx:"
          docker service logs monitoring_nginx
